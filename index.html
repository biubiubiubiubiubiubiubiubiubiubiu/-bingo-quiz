<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F0F4F0" id="theme-color-meta">
    <title>斌狗！通关！</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- 样式 -->
    <link rel="stylesheet" href="css/app.css">

    <!-- 引入 SheetJS -->
    <!-- 预先应用主题，彻底消除暗色模式白屏闪烁 (FOUC) -->
    <script>
        (function() {
            var t = localStorage.getItem('app_theme');
            var m = localStorage.getItem('app_mode');
            var k = localStorage.getItem('app_kid_theme');
            if (m === 'child') {
                document.documentElement.setAttribute('data-mode', 'child');
                if (k) document.documentElement.setAttribute('data-theme', k);
            } else if (t) {
                document.documentElement.setAttribute('data-theme', t);
            }
        })();
    </script>


    <!-- 引入 SheetJS (defer 避免首屏主线程阻塞) -->
    <script src="vendor/xlsx.full.min.js" defer></script>
</head>

<body>

    <!-- Loading -->
    <div class="loader-overlay" id="global-loader">
        <div class="spinner"></div>
        <p style="color:var(--text-sub); margin-top:10px;" id="loader-text">猛犬挖掘中...</p>
    </div>

    <!-- VIEW 1: 题库列表首页 -->
    <div id="view-home" class="container" style="padding: 0 20px;">
        <div class="nav-bar" style="padding-left:0; padding-right:0;">
            <div>
                <div class="nav-title">我的狗窝 <span class="bingo-badge">Pro</span></div>
                <div style="font-size:13px; color:var(--text-sub);">离线可用 · 无限狗窝 · 随时复盘</div>
            </div>
            <div style="display:flex; gap:10px;">
                <!-- 在 view-home 的 nav-bar div里 -->
                <button class="btn btn-ghost btn-icon btn-child-toggle" onclick="toggleChildMode()" title="切换儿童模式"
                    style="color: #FF9F1C;">
                    <span id="child-icon">👶</span>
                </button>
                <button class="btn btn-ghost btn-icon btn-theme-toggle" onclick="toggleTheme()" title="切换主题">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="btn btn-ghost btn-icon" onclick="exportBackup()" title="导出备份">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <button class="btn btn-ghost btn-icon" onclick="document.getElementById('backup-input').click()"
                    title="导入备份">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </button>
                <button class="btn btn-ghost btn-icon btn-delete" onclick="deleteAllData()" title="删除所有数据">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
                <button id="btn-install-pwa" class="btn btn-ghost btn-icon" style="display: none;" title="安装应用">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="8 17 12 21 16 17"></polyline>
                        <line x1="12" y1="12" x2="12" y2="21"></line>
                        <path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 儿童模式海鲜宠物伴学卡片 -->
        <div id="child-pet-home-badge" class="child-pet-home-badge ios-card" style="display:none;"></div>

        <div id="db-list-container"></div>

        <div class="ios-card" id="empty-state"
            style="text-align:center; padding:40px 20px; display:none; cursor: pointer;" onclick="showImportModal()">
            <div style="font-size:40px; margin-bottom:10px;">🦴</div>
            <h3 style="margin:0;">狗窝空空如也</h3>
            <p style="color:var(--text-sub);">快去挖点新骨头 (+)，支持表格文件</p>
        </div>

        <div class="btn-float" onclick="showImportModal()">+</div>
    </div>

    <!-- VIEW 2: 单个题库仪表盘 -->
    <div id="view-dashboard" class="container" style="padding: 0 20px; display:none;">
        <div class="nav-bar" style="padding-left:0; padding-right:0;">
            <button class="btn btn-ghost btn-icon btn-back-home" onclick="history.back()" title="返回">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div style="font-weight:bold; font-size:16px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                id="dash-title">狗窝详情</div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-ghost btn-icon btn-theme-toggle" onclick="toggleTheme()" title="切换主题">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="btn btn-ghost btn-icon" onclick="exportDbToExcel(currentDb.id)" title="导出题库为 Excel">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <button class="btn btn-ghost btn-icon btn-delete" onclick="deleteCurrentDb()" title="删除题库">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </div>
        </div>

        <div class="ios-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <div>
                    <h2 style="margin:0; font-size:28px;" id="dash-count">0</h2>
                    <div style="font-size:12px; color:var(--text-sub);">骨头总数</div>
                </div>
                <div style="text-align:right;">
                    <h2 style="margin:0; font-size:28px; color:var(--success);" id="dash-progress">0</h2>
                    <div style="font-size:12px; color:var(--text-sub);">啃骨头进度</div>
                </div>
            </div>

            <div id="category-container"
                style="margin-bottom: 20px; border-top: 1px solid var(--bg-input); padding-top: 15px;">
                <label for="category-select"
                    style="font-weight: bold; font-size: 14px; color: var(--text-sub); margin-bottom: 8px; display: block;">选择分类</label>
                <select id="category-select" class="btn btn-ghost"
                    style="width:100%; -webkit-appearance: none; appearance: none; text-align: left;"></select>
            </div>

            <button id="btn-resume-quiz" class="btn"
                style="display:none; margin-bottom: 20px; background: linear-gradient(135deg, var(--primary), var(--success)); color: white;"
                onclick="resumeQuiz()">继续上次的进度</button>

            <!-- 按顺序啃区域优化 -->
            <div style="margin-bottom: 10px;">
                <div
                    style="font-size:12px; color:var(--text-sub); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                    <span>📍 起始序号 (进度: <span id="current-prog-display">0</span>)</span>
                    <span id="max-count-hint" style="background:var(--bg-input); padding:2px 6px; border-radius:4px;">共
                        0 根</span>
                </div>

                <!-- 修复后的布局 -->
                <div style="display:flex; gap:12px; align-items: stretch; height: 52px;">
                    <!-- 新增：重置进度按钮 -->
                    <button class="btn btn-ghost" onclick="resetProgress()" title="重置进度到1"
                        style="width: 52px; padding: 0; color: var(--danger); flex-shrink: 0;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12" />
                            <path d="M3 5v7h7" />
                        </svg>
                    </button>

                    <!-- 输入框 -->
                    <div style="flex-grow: 1;">
                        <input type="number" id="sequence-start-input" class="input-ghost" onclick="this.select()"
                            onchange="manualUpdateProgress()">
                    </div>

                    <!-- 按钮 -->
                    <button class="btn btn-primary" style="width: 80px; flex-shrink: 0;"
                        onclick="startQuiz('sequence')">开啃</button>

                    <!-- 下拉框 -->
                    <div style="flex-shrink: 0; width: 90px;">
                        <select id="sequence-count" class="btn btn-ghost">
                            <option value="10">10根</option>
                            <option value="20">20根</option>
                            <option value="50" selected>50根</option>
                            <option value="all">梭哈</option>
                        </select>
                    </div>
                </div>
                <div style="font-size:12px; color:var(--text-sub); margin-top:5px; text-align:center;">
                    * 输入数字后直接开啃，系统会自动记录新进度
                </div>
            </div>

            <div style="display:flex; gap:10px;">
                <button class="btn btn-success" style="flex-grow: 1;" onclick="startQuiz('random')">随便刨一个</button>
                <select id="random-count" class="btn btn-ghost"
                    style="max-width: 100px; padding: 0 15px; -webkit-appearance: none; appearance: none; background-image: none;">
                    <option value="10">10根</option>
                    <option value="20" selected>20根</option>
                    <option value="50">50根</option>
                    <option value="100">100根</option>
                    <option value="all">梭哈</option>
                </select>
            </div>
            <div style="margin-top: 15px;">
                <button id="btn-wrong-answers" class="btn btn-danger" onclick="startWrongAnswerQuiz()">啃硬骨头</button>
                <button id="btn-export-wrong" class="btn btn-ghost" style="display:none; margin-top:8px; width:100%; font-size:13px;" onclick="exportWrongQuestionsToExcel(currentDb.id)">📥 导出硬骨头错题 Excel</button>
            </div>

            <div
                style="margin-top: 20px; border-top: 1px solid var(--bg-input); padding-top: 15px; display:flex; gap:10px;">
                <button class="btn btn-primary"
                    style="background: linear-gradient(135deg, #D9A869, #C18842); flex-grow: 1;"
                    onclick="startMockExam()">模拟开啃</button>
                <select id="mock-exam-count" class="btn btn-ghost"
                    style="max-width: 100px; padding: 0 15px; -webkit-appearance: none; appearance: none; background-image: none;">
                    <option value="10">10根</option>
                    <option value="20">20根</option>
                    <option value="50" selected>50根</option>
                    <option value="100">100根</option>
                </select>
            </div>
        </div>

        <div class="ios-card">
            <h4 style="margin:0 0 15px 0;">📜 啃骨头的记忆 (点击回看)</h4>
            <div id="history-list"></div>
            <button class="btn btn-ghost" id="no-history-btn" style="display:none;">还没啃过呢</button>
        </div>
    </div>

    <!-- VIEW 3: 答题/回看界面 -->
    <div id="view-quiz" style="display:none;">
        <div class="nav-bar">
            <div style="font-size:14px; font-weight:bold; color:var(--text-sub);" id="quiz-progress-text">1/20</div>
            <div style="font-size:16px; font-weight:bold; color:var(--primary);" id="quiz-timer"></div>
            <button class="btn btn-ghost btn-icon btn-theme-toggle" onclick="toggleTheme()" title="切换主题">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <button class="btn btn-ghost btn-icon btn-quiz-exit" onclick="handleQuizExit()" title="退出">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- 儿童模式海鲜萌宠答题伴学小组件 -->
        <div id="child-pet-quiz-widget" class="child-pet-quiz-widget" style="display:none;" onclick="speakPetQuote()"></div>

        <div class="container" style="padding: 0 16px calc(100px + env(safe-area-inset-bottom)) 16px;">
            <div id="quiz-container"></div>
        </div>

        <!-- 提交按钮区 -->
        <div id="quiz-fab-area"
            style="position:fixed; bottom:0; left:0; width:100%; padding:16px 20px calc(16px + env(safe-area-inset-bottom)) 20px; background:var(--bg-body); border-top:1px solid var(--bg-input); display:flex; gap:10px; z-index:90;">
            <button class="btn btn-success" onclick="submitPaper()">汪！交卷！</button>
        </div>
    </div>

    <!-- Modal: 导入 -->
    <div class="modal-mask" id="modal-import">
        <div class="modal-box">
            <h3 style="margin-top:0;">挖掘新宝藏</h3>
            <p style="font-size:13px; color:var(--text-sub);">宝藏地图 (.xlsx/.xls) 指南：<br>必须标明 "题目"、"答案" 等...</p>

            <div id="import-feedback" style="margin-top:15px; display:none;">
                <div id="import-loader" class="spinner"
                    style="display:none; margin: 0 auto 10px auto; width:25px; height:25px; border-width: 3px;"></div>
                <p id="import-status" style="font-size:13px; color:var(--danger); text-align:center; margin:0;"></p>
            </div>

            <input type="file" id="file-input" accept=".xlsx, .xls" style="display:none"
                onchange="handleFileSelect(this)">

            <button class="btn btn-primary" id="btn-select-file"
                onclick="document.getElementById('file-input').click()">📂 选择藏宝图</button>

            <div id="import-preview" style="display:none; margin-top:15px;">
                <div id="sheet-selection-container"></div>
                <div style="font-size:12px; color:var(--success);">发现宝藏！</div>
            </div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn btn-ghost" onclick="closeImportModal()">溜了溜了</button>
                <button class="btn btn-primary" id="btn-confirm-import" style="display:none;"
                    onclick="confirmImport()">埋进狗窝</button>
            </div>
        </div>
    </div>

    <!-- Modal: 成绩单 -->
    <div class="modal-mask" id="modal-score">
        <div class="modal-box" style="text-align:center;">
            <h2 style="margin:10px 0;">啃完啦！</h2>
            <div style="font-size:48px; font-weight:800; color:var(--primary);" id="result-score">90</div>
            <p style="color:var(--text-sub);">智力值</p>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn btn-ghost" onclick="finishExamAndExit()">回狗窝</button>
                <button class="btn btn-primary" onclick="enterReviewMode()">回味一下</button>
            </div>
        </div>
    </div>

    <!-- 主应用脚本（按依赖顺序加载，共享全局作用域） -->
    <script src="js/app.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/import.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/child-mode.js"></script>

    <!-- TinyGesture (ES module, 桥接到全局) -->
    <script src="vendor/tinygesture.min.js"></script>




    <!-- Modal: 海底水族馆 (儿童模式海鲜选宠) -->
    <div class="modal-mask" id="modal-pet-selection">
        <div class="modal-box" style="text-align:center; max-width:440px;">
            <h3 style="margin-top:0;">🐠 海底水族馆</h3>
            <p style="font-size:13px; color:var(--text-sub); margin-bottom:15px;">选择一只可爱的海鲜小伙伴陪你一起刷题吧！</p>
            <div id="pet-selection-cards" class="pet-cards-grid"></div>
            <div style="margin-top:20px;">
                <button class="btn btn-ghost" onclick="closePetModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 儿童模式反馈遮罩 (含海鲜宠物喂食动画) -->
    <div id="child-feedback" class="child-feedback-modal" onclick="nextChildQuestion()">
        <div class="child-star">⭐</div>
        <div id="feedback-pet-container" style="margin-top:10px;"></div>
        <h2 style="color:var(--primary); margin-top:15px; font-size: 26px;" id="feedback-title">太棒啦！</h2>
        <p style="color:var(--text-sub);">点击屏幕继续</p>
    </div>

    <!-- 备份导入隐藏文件框 -->
    <input type="file" id="backup-input" accept=".json" style="display:none" onchange="handleBackupSelect(this)">
</body>

</html>
